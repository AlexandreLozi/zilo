name: ci-web

on:
  push:
    branches: [main]
    paths:
      - '*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.prettier*'
      - '.gitignore'
      - 'api/openapi.yaml'
      - 'packages/**'
      - 'apps/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - '*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.prettier*'
      - '.gitignore'
      - 'api/openapi.yaml'
      - 'packages/**'
      - 'apps/**'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Licence gate (default-deny)
        run: pnpm license-check

      - name: Format (FE-owned files)
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Install Playwright browsers
        run: pnpm --filter @zilo/demo exec playwright install --with-deps chromium firefox webkit

      - name: Playwright E2E (Chromium, Firefox, WebKit; demo smoke, catalog axe + keyboard)
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/demo/playwright-report/
            apps/demo/test-results/
            apps/catalog/playwright-report/
            apps/catalog/test-results/
          retention-days: 14
          if-no-files-found: ignore
